# Configuracao do analisador estatico.
#
# Ver https://dart.dev/tools#ides-and-editors. Na linha de comando:
# `flutter analyze`.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include: package:flutter_lints/flutter.yaml

linter:
  # CRITERIO DE ADMISSAO DESTA LISTA: a regra tem ZERO violacoes no codigo
  # atual no momento em que entra.
  #
  # O motivo e o mesmo que governa o gate em scripts/qa-local.mjs: uma regra
  # que reprova codigo legado quebra `flutter analyze` para todo mundo, e um
  # gate que impede trabalho legitimo e um gate que sera arrancado. Estas
  # regras nao pedem faxina -- elas travam um estado que o repositorio JA
  # alcancou, para que ele nao se perca.
  #
  # Para acrescentar uma regra: habilite, rode `flutter analyze`, e so mantenha
  # se o resultado for zero. Havendo violacoes, ou corrija-as no mesmo commit,
  # ou registre a regra na lista de adiadas no fim do arquivo.
  rules:
    # --- Construcao de widget ---
    # `const` onde cabe: evita reconstruir subarvore a cada quadro.
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    # Container que so pinta cor ou decoracao carrega maquinaria que nao usa.
    - use_colored_box
    - avoid_unnecessary_containers
    # Container vazio no papel de espacador. Reforca o `Gap` de FinSpace.
    - sized_box_for_whitespace
    - use_super_parameters

    # --- Correcao ---
    # Future sem await nem unawaited(): a falha some sem rastro, e num caminho
    # de rede ou de persistencia isso vira dado perdido em silencio.
    - unawaited_futures
    - unnecessary_await_in_return
    # Chamada em `dynamic` escapa da verificacao de tipo -- inaceitavel em
    # caminho que carrega dinheiro.
    - avoid_dynamic_calls
    - avoid_type_to_string
    - throw_in_finally
    - unnecessary_statements
    - avoid_returning_null_for_void
    - avoid_slow_async_io
    - no_adjacent_strings_in_list

    # --- Clareza ---
    - always_declare_return_types
    - prefer_single_quotes
    - avoid_escaping_inner_quotes
    - require_trailing_commas
    - unnecessary_lambdas
    - prefer_final_in_for_each
    - use_string_buffers

