name: equisim_core
description: >-
  Núcleo de domínio do Equisim: valuation por DCF/CAPM, backtest de carteiras e
  métricas de desempenho. Pacote Dart puro — sem Flutter, sem rede, sem I/O.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.8.0

# Sem dependências de runtime, por decisão de arquitetura.
# A pureza é verificada automaticamente por test/core/purity_test.dart, na
# raiz do repositório: os testes do núcleo moram com os do aplicativo, em
# test/, e rodam a partir de lá.

dev_dependencies:
  lints: ^5.0.0
