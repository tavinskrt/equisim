<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d"><title id="t">Valor presente de R$ 1.000 por ano e taxa</title><desc id="d">Três curvas decrescentes: a 8%, 12% e 16% ao ano, R$ 1.000 no ano 10 valem hoje R$ 463,19, R$ 321,97 e R$ 226,68.</desc><style>
