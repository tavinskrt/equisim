name: equisim
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  # Piso do SDK do Flutter: abaixo disto o 'pub get' recusa a resolucao com
  # mensagem explicita, em vez de o projeto quebrar mais adiante na
  # compilacao de algum plugin. Mantenha alinhado com o README.
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Núcleo de domínio: Dart puro, sem Flutter e sem rede.
  # A pureza é garantida por teste em packages/equisim_core/test/purity_test.dart.
  equisim_core:
    path: packages/equisim_core

  flutter_dotenv: ^6.0.1    # Permite carregar variáveis de ambiente a partir de um arquivo .env
  intl: ^0.20.3             # Formatação de datas e números internacionalizados
  provider: ^6.0.0          # Gerenciamento de estado e injeção de dependências
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.1
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_riverpod: ^3.4.2
  fl_chart: ^1.2.0

  # Painel de auditoria de cálculo (rota /logs).
  flutter_math_fork: ^0.7.4  # Renderização TeX das fórmulas, em Dart puro
  web: ^1.1.0                # BroadcastChannel e window.open, via dart:js_interop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - .env


