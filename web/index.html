<!DOCTYPE html>
<html>
<head>
  <!--
    Se o aplicativo web for servido num caminho que nao seja a raiz, altere o
    valor de href abaixo para refletir o caminho base de onde ele e servido.

    O caminho abaixo tem de comecar e terminar com barra "/" para funcionar
    corretamente.

    Para mais detalhes:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    Isto e um marcador do base href, que sera substituido pelo valor do
    argumento `--base-href` passado ao `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Um novo projeto Flutter.">

  <!-- Meta tags e icones do iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Equisim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Icone da aba -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Equisim</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    O script "flutter_bootstrap.js" pode ser personalizado. Isso serve para
    passar uma configuracao propria ao carregador do Flutter ou para dar
    retorno ao usuario durante a inicializacao.

    Para mais detalhes:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
